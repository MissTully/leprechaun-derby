<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Shamrock">
  <defs>
    <radialGradient id="leaf" cx="46%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#66C95D"/>
      <stop offset="52%" stop-color="#33A646"/>
      <stop offset="100%" stop-color="#127A31"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#178235"/>
      <stop offset="55%" stop-color="#34AF49"/>
      <stop offset="100%" stop-color="#63CA61"/>
    </linearGradient>
  </defs>

  <!-- stem -->
  <path d="M256 262 C 266 340, 252 424, 260 500"
        fill="none" stroke="url(#stem)" stroke-width="16" stroke-linecap="round"/>

  <!-- three symmetric heart leaflets: deep outer cleft, tips meeting at (256,256) -->
  <g stroke="#0E5F27" stroke-width="3.5" stroke-linejoin="round">
    <g id="lf">
      <path d="M256 256
               C 236 222, 150 220, 150 166
               C 150 108, 208 92, 240 128
               C 249 138, 252 140, 256 152
               C 260 140, 263 138, 272 128
               C 304 92, 362 108, 362 166
               C 362 220, 276 222, 256 256 Z"
            fill="url(#leaf)"/>
      <!-- central rib + side veins -->
      <g stroke="#9EE27F" stroke-width="3.2" stroke-linecap="round" opacity="0.55" fill="none">
        <path d="M256 250 L256 150"/>
        <path d="M256 236 L206 172"/>
        <path d="M256 236 L306 172"/>
      </g>
    </g>
    <use href="#lf" transform="rotate(120 256 256)"/>
    <use href="#lf" transform="rotate(240 256 256)"/>
  </g>
</svg>
